<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Macchina Cifrante Enigma</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0d0d0d;
            color: #d4cebe;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            overflow: hidden;
        }

        html {
            height: -webkit-fill-available;
        }

        /* --- TELO ROSSO COPRI-MACCHINA --- */
        #cover-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #4a0c0c;
            background-image: 
                radial-gradient(circle, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.8) 100%),
                repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(0,0,0,0.05) 10px, rgba(0,0,0,0.05) 20px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 100px #000;
        }

        .cover-box {
            background: #1a1816;
            border: 3px solid #3a322b;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            width: 85%;
            max-width: 400px;
        }

        .cover-btn {
            background: #2a2521;
            color: #b5a48b;
            border: 2px solid #55483c;
            padding: 12px 20px;
            font-family: inherit;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }

        .cover-btn:hover, .cover-btn:active {
            background: #3a332d;
            color: #e6dac3;
            border-color: #8c7661;
        }

        /* --- STRUTTURA MACCHINA --- */
        .machine-container {
            width: 98vw;
            max-width: 1000px;
            height: 96vh;
            max-height: 850px;
            background: #181715;
            border: 3px solid #2d2924;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #2d2924;
            padding-bottom: 8px;
            z-index: 10;
        }

        .mode-btn, .layout-toggle-btn {
            background: #24201c;
            color: #8c8275;
            border: 2px solid #403830;
            padding: 6px 10px;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
        }

        .mode-btn.active {
            color: #d4cebe;
            border-color: #8c7661;
            background: #332d27;
        }

        .logo-enigma {
            height: 28px;
            max-width: 110px;
            object-fit: contain;
            filter: invert(0.85) opacity(0.7) drop-shadow(0 0 2px rgba(0,0,0,0.8));
        }

        /* --- VIEWPORT SWIPE --- */
        .slider-viewport {
            width: 100%;
            flex: 1;
            display: flex;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .slider-track {
            display: flex;
            width: 200%;
            height: 100%;
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .slide-page {
            width: 50%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
            padding: 5px 0;
            overflow-y: auto;
        }

        /* --- PANNELLO TESTO CIFRATO (SOSTITUISCE LAMPADINE) --- */
        .text-panel {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .text-box-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .text-label {
            font-size: 0.75rem;
            color: #8c8275;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        textarea {
            width: 100%;
            flex: 1;
            background: #0a0a09;
            border: 1px solid #332d27;
            color: #e8a838;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            padding: 10px;
            resize: none;
            outline: none;
            border-radius: 4px;
            user-select: text;
        }

        textarea:focus {
            border-color: #8c7661;
        }

        .output-box {
            background: #050505;
            border: 1px solid #4a3e2c;
            color: #ffe89c;
            word-break: break-all;
        }

        .action-bar {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            flex: 1;
            background: #24201c;
            color: #b5a48b;
            border: 1px solid #403830;
            padding: 8px;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            border-radius: 4px;
        }

        .action-btn:active {
            background: #38312b;
            color: #fff;
        }

        /* --- CONTROLLI NAVIGAZIONE SCHERMATA --- */
        .page-navigation {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 5px 0;
        }

        .nav-arrow {
            background: #24201c;
            color: #b5a48b;
            border: 1px solid #403830;
            border-radius: 6px;
            font-size: 1.1rem;
            padding: 4px 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .nav-arrow:active {
            background: #3a322b;
            color: #fff;
        }

        .page-dots {
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #3a322b;
            cursor: pointer;
            transition: background 0.3s;
        }

        .dot.active {
            background: #ff9d00;
            box-shadow: 0 0 8px #ff9d00;
        }

        /* --- SEZIONE ROTORI --- */
        .rotors-container {
            display: flex;
            gap: 4px;
            justify-content: center;
            align-items: center;
            background: #100f0e;
            padding: 8px 4px;
            border: 2px solid #26221e;
            width: 100%;
            flex-wrap: wrap;
        }

        .rotor-group {
            display: flex;
            gap: 3px;
            justify-content: center;
        }

        .rotor-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .rotor-step-btn {
            background: #24201c;
            color: #8c8275;
            border: 1px solid #403830;
            width: 24px;
            height: 22px;
            font-size: 0.7rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .rotor-step-btn:active {
            background: #38312b;
            color: #fff;
        }

        .rotor-val {
            font-size: 0.85rem;
            font-weight: bold;
            color: #e8a838;
            background: #000;
            padding: 1px 2px;
            border: 1px solid #332b20;
            min-width: 24px;
            text-align: center;
        }

        .rotor-selector {
            font-size: 0.75rem;
            font-weight: bold;
            color: #b5a48b;
            cursor: pointer;
            padding: 2px;
        }

        /* --- PANNELLO SCAMBI CON STANGHETTE | A | --- */
        .plugboard-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 100%;
            align-items: center;
            background: #100f0e;
            border: 2px solid #26221e;
            padding: 8px;
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 4px;
            width: 100%;
        }

        .plug-pair {
            display: flex;
            align-items: center;
            background: #050505;
            border: 1px solid #2a241e;
            padding: 1px 2px;
            cursor: pointer;
        }

        .plug-pair.selected {
            border-color: #ff9d00;
            background: #1a140a;
        }

        .plug-bar {
            font-size: 0.75rem;
            font-weight: bold;
            color: #4a4237;
        }

        .plug-letter {
            font-size: 0.75rem;
            font-weight: bold;
            color: #a89f91;
            padding: 0 1px;
        }

        @media (max-width: 600px) {
            .mode-btn, .layout-toggle-btn {
                font-size: 0.7rem;
                padding: 4px 6px;
            }
            .logo-enigma {
                height: 22px;
            }
        }
    </style>
</head>
<body>

    <!-- TELO ROSSO COPRI-MACCHINA -->
    <div id="cover-canvas">
        <div class="cover-box">
            <button class="cover-btn" onclick="selectLayout('QWERTY')">QWERTY</button>
            <button class="cover-btn" onclick="selectLayout('QWERTZ')">QWERTZ</button>
            <button class="cover-btn" onclick="selectLayout('AZERTY')">AZERTY</button>
            <button class="cover-btn" onclick="selectLayout('CYRILLIC')">КИРИЛЛИЦА</button>
        </div>
    </div>

    <!-- MACCHINA ENIGMA -->
    <div class="machine-container">
        
        <div class="top-bar">
            <button id="mode-btn" class="mode-btn active" onclick="toggleMode()">MODE: CIFRA</button>
            <img src="immagine.jpg" alt="ENIGMA" class="logo-enigma">
            <button id="layout-indicator" class="layout-toggle-btn" onclick="showCover()">QWERTY</button>
        </div>

        <!-- SLIDER VIEWPORT -->
        <div class="slider-viewport">
            <div class="slider-track" id="slider-track">
                
                <!-- SCHERMATA 1: TESTO INPUT E OUTPUT CIFRATO -->
                <div class="slide-page">
                    <div class="text-panel">
                        <div class="text-box-group">
                            <span class="text-label">Testo in Ingresso:</span>
                            <textarea id="input-text" placeholder="Scrivi qui il messaggio..." oninput="processFullText()"></textarea>
                        </div>
                        <div class="text-box-group">
                            <span class="text-label">Risultato Cifrato / Decifrato:</span>
                            <textarea id="output-text" class="output-box" readonly placeholder="Il risultato apparirà qui..."></textarea>
                        </div>
                        <div class="action-bar">
                            <button class="action-btn" onclick="clearTexts()">CANCELLA</button>
                            <button class="action-btn" onclick="copyOutput()">COPIA RISULTATO</button>
                        </div>
                    </div>
                </div>

                <!-- SCHERMATA 2: CONTROLLO (ROTORI + SCAMBI) -->
                <div class="slide-page">
                    <div class="rotors-container">
                        <div class="rotor-group" id="personal-rotors"></div>
                        <div class="rotor-group" id="context-rotors"></div>
                    </div>

                    <div class="plugboard-container" id="plugboard"></div>
                </div>

            </div>
        </div>

        <!-- CONTROLLI NAVIGAZIONE SCHERMATE -->
        <div class="page-navigation">
            <button class="nav-arrow" onclick="goToPage(0)">←</button>
            <div class="page-dots">
                <div class="dot active" id="dot-0" onclick="goToPage(0)"></div>
                <div class="dot" id="dot-1" onclick="goToPage(1)"></div>
            </div>
            <button class="nav-arrow" onclick="goToPage(1)">→</button>
        </div>

    </div>

    <script>
        const LAYOUTS = {
            QWERTY: [
                ['Q','W','E','R','T','Y','U','I','O','P'],
                ['A','S','D','F','G','H','J','K','L'],
                ['Z','X','C','V','B','N','M']
            ],
            QWERTZ: [
                ['Q','W','E','R','T','Z','U','I','O','P'],
                ['A','S','D','F','G','H','J','K','L'],
                ['Y','X','C','V','B','N','M']
            ],
            AZERTY: [
                ['A','Z','E','R','T','Y','U','I','O','P'],
                ['Q','S','D','F','G','H','J','K','L','M'],
                ['W','X','C','V','B','N']
            ],
            CYRILLIC: [
                ['Й','Ц','У','К','Е','Н','Г','Ш','Щ','З','Х'],
                ['Ф','Ы','В','А','П','Р','О','Л','Д','Ж','Э'],
                ['Я','Ч','С','М','И','Т','Ь','Б','Ю']
            ]
        };

        const ROTOR_WIRINGS = [
            [4, 10, 1, 19, 8, 14, 21, 2, 25, 0, 11, 18, 5, 22, 9, 16, 3, 20, 7, 24, 13, 6, 17, 12, 15, 23],
            [21, 3, 15, 1, 19, 10, 14, 22, 8, 25, 0, 17, 12, 5, 18, 2, 20, 7, 24, 11, 4, 16, 9, 23, 6, 13],
            [9, 1, 6, 18, 15, 24, 10, 2, 13, 22, 0, 17, 4, 21, 7, 19, 11, 3, 25, 12, 14, 8, 20, 5, 16, 23],
            [15, 7, 2, 18, 12, 21, 0, 13, 9, 24, 4, 19, 1, 14, 22, 10, 25, 3, 16, 6, 20, 8, 17, 11, 5, 23],
            [0, 23, 8, 14, 1, 21, 10, 17, 4, 19, 6, 12, 25, 2, 15, 7, 22, 9, 18, 5, 20, 11, 16, 3, 13, 24],
            [11, 4, 19, 2, 21, 8, 16, 25, 1, 14, 7, 20, 10, 23, 5, 17, 0, 22, 12, 3, 18, 9, 15, 6, 24, 13],
            [17, 2, 12, 22, 7, 19, 0, 24, 15, 4, 20, 9, 14, 1, 25, 8, 13, 5, 18, 10, 21, 3, 16, 6, 23, 11],
            [2, 14, 6, 20, 11, 23, 8, 17, 1, 22, 12, 25, 4, 18, 9, 0, 15, 5, 21, 10, 16, 3, 19, 7, 24, 13],
            [19, 8, 1, 15, 22, 5, 17, 11, 24, 4, 18, 0, 13, 21, 7, 25, 3, 12, 20, 9, 14, 2, 16, 6, 23, 10],
            [8, 20, 3, 14, 22, 1, 17, 9, 25, 4, 12, 21, 0, 16, 6, 24, 11, 2, 18, 7, 15, 5, 19, 10, 23, 13]
        ];

        let currentLayout = 'QWERTY';
        let isCipherMode = true;

        let rotors = [
            { type: 0, tic: 0 }, { type: 1, tic: 0 }, { type: 2, tic: 0 },
            { type: 3, tic: 0 }, { type: 4, tic: 0 }, { type: 5, tic: 0 },
            { type: 6, tic: 0 }, { type: 7, tic: 0 }, { type: 8, tic: 0 }
        ];

        let plugboardPairs = {};
        let selectedPlugChar = null;

        function goToPage(pageIndex) {
            const track = document.getElementById('slider-track');
            track.style.transform = `translateX(-${pageIndex * 50}%)`;

            document.getElementById('dot-0').classList.toggle('active', pageIndex === 0);
            document.getElementById('dot-1').classList.toggle('active', pageIndex === 1);
        }

        function initRotorsUI() {
            const personalContainer = document.getElementById('personal-rotors');
            const contextContainer = document.getElementById('context-rotors');
            
            personalContainer.innerHTML = '';
            contextContainer.innerHTML = '';

            rotors.forEach((r, idx) => {
                const unit = document.createElement('div');
                unit.className = 'rotor-unit';
                unit.innerHTML = `
                    <button class="rotor-step-btn" onclick="stepRotor(${idx}, 1)">▲</button>
                    <div class="rotor-val" id="tic-${idx}">${r.tic + 1}</div>
                    <button class="rotor-step-btn" onclick="stepRotor(${idx}, -1)">▼</button>
                    <div class="rotor-selector" onclick="changeRotorType(${idx})">~${r.type}~</div>
                `;

                if (idx < 6) personalContainer.appendChild(unit);
                else contextContainer.appendChild(unit);
            });
        }

        function renderPlugboard() {
            const board = document.getElementById('plugboard');
            board.innerHTML = '';

            LAYOUTS[currentLayout].forEach(row => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'keyboard-row';

                row.forEach(char => {
                    const pairDiv = document.createElement('div');
                    pairDiv.className = 'plug-pair';
                    if (selectedPlugChar === char) pairDiv.classList.add('selected');

                    const target = plugboardPairs[char];
                    const color = target ? getCharColor(char, target) : '#a89f91';

                    pairDiv.innerHTML = `
                        <span class="plug-bar" style="color:${color}">|</span>
                        <span class="plug-letter" style="color:${color}">${char}</span>
                        <span class="plug-bar" style="color:${color}">|</span>
                    `;

                    pairDiv.onclick = () => handlePlugClick(char);
                    rowDiv.appendChild(pairDiv);
                });

                board.appendChild(rowDiv);
            });
        }

        function getCharColor(c1, c2) {
            let code = (c1.charCodeAt(0) + c2.charCodeAt(0)) * 23;
            let hue = code % 360;
            return `hsl(${hue}, 85%, 65%)`;
        }

        function handlePlugClick(char) {
            if (plugboardPairs[char]) {
                const other = plugboardPairs[char];
                delete plugboardPairs[char];
                delete plugboardPairs[other];
                selectedPlugChar = null;
            } else if (!selectedPlugChar) {
                selectedPlugChar = char;
            } else if (selectedPlugChar === char) {
                selectedPlugChar = null;
            } else {
                if (plugboardPairs[selectedPlugChar]) delete plugboardPairs[plugboardPairs[selectedPlugChar]];

                plugboardPairs[selectedPlugChar] = char;
                plugboardPairs[char] = selectedPlugChar;
                selectedPlugChar = null;
            }
            renderPlugboard();
            processFullText();
        }

        function selectLayout(layoutKey) {
            currentLayout = layoutKey;
            plugboardPairs = {};
            selectedPlugChar = null;
            document.getElementById('layout-indicator').innerText = layoutKey;
            renderPlugboard();
            document.getElementById('cover-canvas').style.display = 'none';
            processFullText();
        }

        function showCover() {
            document.getElementById('cover-canvas').style.display = 'flex';
        }

        function toggleMode() {
            isCipherMode = !isCipherMode;
            const btn = document.getElementById('mode-btn');
            btn.innerText = isCipherMode ? "MODE: CIFRA" : "MODE: DECIFRA";
            processFullText();
        }

        function changeRotorType(idx) {
            rotors[idx].type = (rotors[idx].type + 1) % 10;
            initRotorsUI();
            processFullText();
        }

        function stepRotor(idx, dir) {
            rotors[idx].tic = (rotors[idx].tic + dir + 26) % 26;
            document.getElementById(`tic-${idx}`).innerText = rotors[idx].tic + 1;
            processFullText();
        }

        function getAllChars() {
            return LAYOUTS[currentLayout].flat();
        }

        /* --- ELABORAZIONE TESTO COMPLETO --- */
        function processFullText() {
            const rawText = document.getElementById('input-text').value.toUpperCase();
            const allChars = getAllChars();
            
            // Copia dello stato iniziale dei rotori per simulare la sequenza
            let tempRotors = rotors.map(r => ({ ...r }));
            let result = "";

            for (let char of rawText) {
                if (!allChars.includes(char)) {
                    result += char; // Mantiene spazi o punteggiatura non mappati
                    continue;
                }

                // Applicazione Plugboard
                let current = plugboardPairs[char] || char;
                let index = allChars.indexOf(current);

                const numChars = allChars.length;

                if (isCipherMode) {
                    for (let i = 0; i < tempRotors.length; i++) {
                        const r = tempRotors[i];
                        const shift = r.tic;
                        const wiring = ROTOR_WIRINGS[r.type];
                        
                        let shiftedIn = (index + shift) % numChars;
                        let mapped = wiring[shiftedIn % 26] % numChars;
                        index = (mapped - shift + numChars) % numChars;
                    }
                } else {
                    for (let i = tempRotors.length - 1; i >= 0; i--) {
                        const r = tempRotors[i];
                        const shift = r.tic;
                        const wiring = ROTOR_WIRINGS[r.type];

                        let shiftedIn = (index + shift) % numChars;
                        let unmapped = 0;
                        for (let w = 0; w < 26; w++) {
                            if (wiring[w] % numChars === shiftedIn) {
                                unmapped = w;
                                break;
                            }
                        }
                        index = (unmapped - shift + numChars) % numChars;
                    }
                }

                let outChar = allChars[index];
                result += (plugboardPairs[outChar] || outChar);

                // Avanzamento odometro
                for (let i = 0; i < tempRotors.length; i++) {
                    tempRotors[i].tic = (tempRotors[i].tic + 1) % 26;
                    if (tempRotors[i].tic !== 0) break;
                }
            }

            document.getElementById('output-text').value = result;
        }

        function clearTexts() {
            document.getElementById('input-text').value = '';
            document.getElementById('output-text').value = '';
        }

        function copyOutput() {
            const output = document.getElementById('output-text');
            if (output.value) {
                navigator.clipboard.writeText(output.value);
            }
        }

        initRotorsUI();
        renderPlugboard();
    </script>
</body>
</html>
